# alembic.ini
[alembic]
script_location = alembic
prepend_sys_path = .

# Construct the SQLAlchemy URL using environment variables
# These variables are expected to be set in the Docker environment (e.g., by docker-compose)
# Ensure your .env file (used by docker-compose) defines these.
sqlalchemy.url = postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:${POSTGRES_PORT}/${POSTGRES_DB}

[post_write_hooks]
# You can configure hooks here if needed later, e.g., for code formatting.
# Example: autopep8 = E7,E12,W503,W504,W6

# Logging configuration (can be customized)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S 