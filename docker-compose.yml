version: "3.8"

services:
    db:
        image: postgres:15-alpine
        container_name: bill_digitizer_db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: bill_digitizer_db
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d bill_digitizer_db"]
            interval: 10s
            timeout: 5s
            retries: 5

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: bill_digitizer_pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: admin
            PGADMIN_CONFIG_SERVER_MODE: "False"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        ports:
            - "5050:80"
        depends_on:
            - db
        restart: unless-stopped

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: bill_digitizer_backend
        command: sh -c "/app/prestart.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
        volumes:
            - ./backend:/app
        ports:
            - "8000:8000"
        env_file:
            - ./backend/.env
        environment:
            POSTGRES_PORT: 5432
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: bill_digitizer_frontend
        command: npm start
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - "3000:3000"
        environment:
            - CHOKIDAR_USEPOLLING=true
            - REACT_APP_API_URL=http://localhost:8000
        depends_on:
            - backend
        restart: unless-stopped
        stdin_open: true
        tty: true

volumes:
    postgres_data:
        driver: local
    pgadmin_data:
        driver: local
